<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212934"><meta name="description" content="Fold, seal and dispatch eight beautifully wrapped parcels.">
<title>PARCEL PRESS — The Wrapping Desk</title>
<link rel="icon" href="icon.svg">
<style>:root {
  color-scheme: light;
  --night:#212934; --ink:#202b35; --muted:#5b676a; --paper:#f6eddb; --line:#d6cbb7; --red:#933747;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
* { box-sizing:border-box; }
[hidden] { display:none!important; }
body { margin:0; background:#151d26; color:var(--ink); overscroll-behavior:none; }
button { font:inherit; font-weight:720; color:inherit; cursor:pointer; min-height:44px; min-width:44px; border:0; touch-action:manipulation; }
button:focus-visible { outline:3px solid #00898c; outline-offset:3px; }
button:disabled { cursor:default; opacity:.52; }
.game { width:min(100%,630px); height:100vh; height:100dvh; min-height:490px; margin:auto; display:grid; grid-template-rows:auto auto minmax(170px,1fr) auto; background:var(--paper); }
.bar { background:var(--night); color:#fff6e4; display:flex; align-items:center; gap:10px; padding:calc(4px + env(safe-area-inset-top)) 14px 4px; }
.mark { display:grid; place-items:center; width:35px; height:35px; color:#f0c681; border:1px solid #a9885b; border-radius:10px; font-size:22px; }
.brand { flex:1; display:grid; gap:1px; }
.brand b { font-size:14px; letter-spacing:.14em; }
.icon { background:transparent; color:inherit; border-radius:10px; font-size:22px; }
.bar .icon { background:#323c47; }
.intro { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; }
h1,h2,p { margin:0; }
h1,h2 { font-family:Georgia,serif; font-weight:500; }
h1 { font-size:clamp(23px,6.4vw,35px); letter-spacing:-.035em; line-height:1.04; margin:3px 0; }
.counter { min-width:64px; padding:5px 8px; border:1px solid var(--line); text-align:center; border-radius:9px; }
.counter { font-size:19px; line-height:1; display:block; font-variant-numeric:tabular-nums; }
.desk { position:relative; isolation:isolate; overflow:hidden; border-radius:13px; margin:0 10px; background:#34434b; }
canvas { width:100%;height:100%;display:block; }
.flaps { position:absolute; inset:0; pointer-events:none; }
.flap { position:absolute; transform:translate(-50%,-50%); display:grid; place-items:center; pointer-events:auto; background:#fff7e5; color:#603135; width:48px; height:48px; border:1px solid #fcdbac; border-radius:50%; box-shadow:0 3px 0 #a5745f,0 5px 9px #1c27366e; font:600 26px Georgia,serif; touch-action:none; }
.flap[data-ready=false] { background:#f8e0cc; border-color:#c09087; color:#7a5553; }
.flap[data-ready=true] { box-shadow:0 3px 0 #a5745f,0 0 0 4px #fff7dd40,0 5px 9px #1c27366e; }
.dropTarget { position:absolute; pointer-events:none; width:42px; height:42px; transform:translate(-50%,-50%); border:2px dashed #fff3d1; border-radius:50%; background:#fff4cf1f; }
.dropTarget i { display:block; margin:13px auto; width:12px;height:12px;border:1px solid #fff5d4; border-radius:50%; }
.heldSeal { position:fixed; z-index:5; pointer-events:none; width:42px; height:42px; border-radius:50%; background:#a3384a; border:3px double #ffd9a5; box-shadow:0 5px 12px #25181880; color:#ffdbad; display:grid; place-items:center; font-size:24px; transform:translate(-50%,-50%); }
.toast { position:absolute; max-width:95%; left:50%; bottom:24px; transform:translateX(-50%); border-radius:9px; color:#fff8e6; background:#24313a; padding:7px 11px; font-size:12px; text-align:center; font-weight:690; pointer-events:none; }
.toast:empty { display:none; }
.dock { display:grid; gap:7px; padding:9px 10px calc(9px + env(safe-area-inset-bottom)); }
.rules { display:flex; flex-wrap:wrap; gap:4px; }
.rule { background:#efe4cf; border-radius:5px; padding:2px 5px; color:#623b35; font-size:11px; font-weight:780; }
.quiet,.primary { border-radius:9px; padding:0 12px; }
.quiet { background:#eadfc9; border:1px solid #d6cbb7; }
.primary { background:var(--red); color:#fff6e5; flex:1; }
#stamp { touch-action:none; }
dialog { color:var(--ink); background:var(--paper); border:1px solid #d6cbb7; border-radius:16px; padding:15px; width:min(calc(100% - 22px),450px); max-height:calc(100% - 22px); box-shadow:0 20px 85px #0e182580; overflow:auto; }
dialog::backdrop { background:#121c29b0; }
.dialogHead { display:flex; justify-content:space-between; align-items:center; padding-bottom:9px; }
.dialogHead h2,.receipt h2 { font-size:26px; }
.order,.swatch { display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; background:#fff8ea; border:1px solid var(--line); border-radius:9px; padding:7px 9px; margin:4px 0; gap:8px; }
.swatch i { width:24px; height:24px; border-radius:5px; background:var(--color); border:1px solid #68504b55; flex:none; }
.swatch b { flex:1; }
.swatch small,.order small { font-size:10px; color:var(--muted); font-weight:650; }
.hint { color:var(--muted); font-size:12px; margin:8px 0; }
.receipt { text-align:center; }
.receipt h2 { margin:4px 0; }
.stars { color:#974048; font-size:30px; letter-spacing:.17em; }
#details { font-size:13px; margin:5px 0 13px; }
@media (orientation:landscape) and (max-height:650px) {
  .game { width:min(100%,960px); height:100vh; height:100dvh; min-height:280px; grid-template-columns:minmax(240px,1fr) minmax(205px,30%); grid-template-rows:auto auto 1fr; padding-bottom:env(safe-area-inset-bottom); }
  .bar { grid-column:1/-1; }
  .intro { grid-column:2; grid-row:2; padding:9px; }
  h1 { font-size:24px; }
  .desk { grid-column:1; grid-row:2/4; margin:6px 0 7px 8px; }
  .dock { grid-column:2; grid-row:3; align-content:start; padding:4px 8px; }

}
@media (max-width:355px) { .intro { padding:8px 12px; }.flap{width:44px;height:44px} }
.desk { min-width:0; min-height:0; }
.desk canvas { position:absolute; inset:0; }
@media (orientation:landscape) and (max-height:380px) {
  .bar { padding-block:env(safe-area-inset-top) 0; }
  .intro { padding:5px 8px; }
  .dock { gap:4px; padding:2px 7px; }
  .rules { gap:2px; }
  .rule { font-size:10px; }
}
@media (orientation:landscape) and (max-height:380px) {
  .intro h1 { font-size:19px; line-height:1.02; }
  .counter { min-width:53px; padding:4px; }
  .counter { font-size:16px; }
}

.orderHeading { display:flex; align-items:center; gap:10px; min-width:0; }
#orderId { color:var(--red); font-size:11px; font-weight:800; letter-spacing:.08em; }
.counter { flex:none; font-size:15px; min-width:55px; padding:7px; }
.dock { justify-items:center; gap:5px; min-height:67px; }
#clue { color:var(--muted); font-size:12px; font-weight:650; }
.rules:empty { display:none; }
.rule { padding:3px 9px; font:700 17px Georgia,serif; }
.dock .primary { width:min(100%,220px); }
.menuTools { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.receipt { position:relative; padding:5px 4px; }
.receipt h2 { margin-inline:42px; }
#back { position:absolute; right:-5px; top:-8px; }
#next { width:min(100%,220px); }
@media (orientation:landscape) and (max-height:650px) {
  .intro { flex-wrap:wrap; gap:4px; }
  .dock { justify-items:start; }
}
</style>
</head>
<body>
<main class="game">
  <header class="bar">
    <div class="mark" aria-hidden="true">✦</div>
    <div class="brand"><b>PARCEL PRESS</b></div>
    <button id="orders" class="icon" aria-label="Open menu">☰</button>
  </header>
  <section class="intro" aria-label="Current order">
    <div class="orderHeading"><span id="orderId"></span><h1 id="title"></h1></div>
    <b class="counter" id="count" aria-label="Folds completed">0 / 4</b>
  </section>
  <section class="desk" id="desk" aria-label="Wrapping board">
    <canvas id="table" aria-hidden="true"></canvas>
    <div id="flaps" class="flaps"></div>
    <div id="dropTarget" class="dropTarget" hidden aria-hidden="true"><i></i></div>
    <div id="heldSeal" class="heldSeal" hidden aria-hidden="true">✦</div>
    <div class="toast" id="toast" role="status"></div>
  </section>
  <section class="dock" aria-label="Wrapping instructions">
    <p id="clue"></p>
    <div id="ruleIcons" class="rules" aria-label="Stacking order"></div>
    <button id="stamp" class="primary" hidden>Seal</button>
    <button id="receipt" class="primary" hidden>Receipt</button>
  </section>
</main>
<dialog id="menu" aria-labelledby="menuTitle">
  <div class="dialogHead"><h2 id="menuTitle"></h2><button id="close" class="icon" aria-label="Close menu">×</button></div>
  <div id="menuTools" class="menuTools">
    <button id="paper" class="quiet">Paper</button>
    <button id="sound" class="quiet" aria-pressed="false">Sound on</button>
    <button id="restart" class="quiet">Restart</button>
  </div>
  <div id="menuBody"></div>
</dialog>
<dialog id="result" aria-labelledby="resultTitle">
  <div class="receipt">
    <button id="back" class="icon" aria-label="Close receipt">×</button>
    <h2 id="resultTitle"></h2>
    <p class="stars" id="stars"></p>
    <p id="details"></p>
    <button id="next" class="primary">Next →</button>
  </div>
</dialog>
<script>(()=>{
const Core=(()=>{

const symbols = ['Leaf', 'Sun', 'Moon', 'Star'];
const glyphs = ['❧', '☀', '☾', '✦'];
const jobs = [
  {name:'Little Thank You', to:'Milo', kind:'BOOKSHOP ORDER', w:2.65,d:2.05,h:.58, paper:0, over:[[2,0],[3,1]], clue:'Moon over Leaf. Star over Sun.'},
  {name:'Tea for Two', to:'Nora', kind:'AFTERNOON DELIVERY', w:2.30,d:2.25,h:.78, paper:1, over:[[0,3],[1,2]], clue:'Leaf over Star. Sun over Moon.'},
  {name:'Midnight Album', to:'Iris', kind:'RECORD STORE ORDER', w:2.64,d:2.54,h:.44, paper:2, over:[[3,2],[2,0]], clue:'Leaf, then Moon, then Star.'},
  {name:'Garden Notes', to:'Sage', kind:'FLOWER SHOP ORDER', w:2.09,d:2.68,h:.65, paper:3, over:[[1,0],[3,1],[2,3]], clue:'Leaf → Sun → Star → Moon.'},
  {name:'The Long Weekend', to:'Theo', kind:'BIRTHDAY DELIVERY', w:2.84,d:1.92,h:.65, paper:1, over:[[1,3],[2,1],[2,0]], clue:'Sun over Star. Moon over Sun and Leaf.'},
  {name:'Studio Opening', to:'June', kind:'GALLERY DELIVERY', w:2.4,d:2.25,h:.9, paper:0, over:[[0,2],[3,0],[1,3]], clue:'Moon → Leaf → Star → Sun.'},
  {name:'Letters From Afar', to:'Avery', kind:'SPECIAL DELIVERY', w:2.55,d:2.12,h:.74, paper:2, over:[[3,0],[3,2],[1,3]], clue:'Star over Leaf and Moon. Sun over Star.'},
  {name:'The Last Parcel', to:'Pip', kind:'CLOSING TIME', w:2.83,d:2.45,h:.92, paper:3, over:[[0,1],[2,0],[3,2]], clue:'Sun → Leaf → Moon → Star.'},
];
const papers = [
  {name:'Peach Grove', base:'#e79775', pale:'#f4b194', ink:'#8b372d', seal:'#962e42', motif:'leaf'},
  {name:'Lemon Press', base:'#e8c45f', pale:'#f6d785', ink:'#7b491e', seal:'#a04329', motif:'sun'},
  {name:'Night Post', base:'#8c94ce', pale:'#a9b2ec', ink:'#3b406e', seal:'#4a376e', motif:'star'},
  {name:'Glass Garden', base:'#92b899', pale:'#b2ceb3', ink:'#345b4d', seal:'#376147', motif:'leaf'},
  {name:'Blue Porcelain', base:'#81bdd4', pale:'#acd6e7', ink:'#265473', seal:'#2e4e78', motif:'star', earned:8, reward:'like'},
  {name:'Berry Foil', base:'#d290ae', pale:'#edb1c9', ink:'#833c5e', seal:'#7e2c57', motif:'sun', earned:16, reward:'comment'},
];

function profile(value) {
  const data = value && typeof value === 'object' ? value : {};
  return {
    best: jobs.map((_, i) => Number.isInteger(data.best?.[i]) ? Math.max(0, Math.min(3, data.best[i])) : 0),
    rewards: {like:data.rewards?.like === true, comment:data.rewards?.comment === true},
    mute: data.mute === true
  };
}

function total(p) { return p.best.reduce((a, b) => a + b, 0); }
function unlocked(p, index) { return index === 0 || p.best[index - 1] > 0; }

function canUsePaper(p, index) {
  const paper = papers[index];
  return !!paper && (!paper.reward || p.rewards[paper.reward] || total(p) >= paper.earned);
}

function mergeProfile(local, incoming) {
  const other = profile(incoming);
  return {
    best: local.best.map((n, i) => Math.max(n, other.best[i])),
    rewards: {like:local.rewards.like || other.rewards.like, comment:local.rewards.comment || other.rewards.comment},
    mute: local.mute
  };
}

function newParcel(job, paper = jobs[job].paper) {
  return {job, paper, folds:[], slips:0, seal:null, stars:0};
}

function missingUnder(state, flap) {
  return jobs[state.job].over.filter(([above, below]) => above === flap && !state.folds.includes(below)).map(pair => pair[1]);
}

function fold(state, flap) {
  if (state.seal || !Number.isInteger(flap) || flap < 0 || flap > 3 || state.folds.includes(flap)) return {kind:'ignored'};
  const missing = missingUnder(state, flap);
  if (missing.length) {
    state.slips += 1;
    return {kind:'blocked', missing};
  }
  state.folds.push(flap);
  return {kind:'folded'};
}

function seal(state, dx, dy) {
  if (state.seal || state.folds.length !== 4 || !Number.isFinite(dx) || !Number.isFinite(dy)) return false;
  const distance = Math.hypot(dx,dy);
  const job = jobs[state.job];
  const x = .858*dx + .514*dy/.65;
  const z = -.514*dx + .858*dy/.65;
  if (Math.abs(x) > job.w/2-.36 || Math.abs(z) > job.d/2-.36) return false;
  state.seal = [dx,dy];
  state.stars = 1 + Number(state.slips === 0) + Number(distance <= .30);
  return true;
}

function restore(data, p) {
  const index = Number.isInteger(data?.job) && jobs[data.job] && unlocked(p,data.job) ? data.job : 0;
  const state = newParcel(index);
  if (data?.job !== index) return state;
  if (canUsePaper(p,data.paper)) state.paper = data.paper;
  if (Array.isArray(data.folds)) {
    for (const flap of data.folds.slice(0,4)) {
      if (fold(state,flap).kind !== 'folded') break;
    }
  }
  state.slips = Number.isInteger(data.slips) ? Math.max(0, Math.min(9999,data.slips)) : 0;
  if (Array.isArray(data.seal)) seal(state,...data.seal);
  return state;
}

return {symbols,glyphs,jobs,papers,profile,total,unlocked,canUsePaper,mergeProfile,newParcel,missingUnder,fold,seal,restore};
})();
const Graphics=(()=>{
const {jobs,papers}=Core;

const axes = [[-1,0],[0,-1],[1,0],[0,1]];
const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
const ease = t => t*t*(3-2*t);
const project = ([x,y,z]) => [.858*x-.514*z, .65*(.514*x+.858*z)-.76*y, .76*(.514*x+.858*z)+.65*y];

function hinge(job, index, progress, layer) {
  const [dx,dz] = axes[index];
  const half = dx ? job.w/2 : job.d/2;
  const width = dx ? job.d : job.w;
  const height = job.h + .018 + layer*.018;
  const reach = half + .085;
  const rise = ease(clamp(progress / .64, 0, 1))*Math.PI/2;
  const turn = rise + ease(clamp((progress-.31) / .69,0,1))*Math.PI/2;
  const line = (travel, y) => [
    [dx*(half+travel) - dz*width/2, y, dz*(half+travel) + dx*width/2],
    [dx*(half+travel) + dz*width/2, y, dz*(half+travel) - dx*width/2]
  ];
  const root = line(0, .004);
  const bend = line(height*Math.cos(rise), height*Math.sin(rise)+.004);
  const tip = line(height*Math.cos(rise)+reach*Math.cos(turn), height*Math.sin(rise)+reach*Math.sin(turn)+.004);
  return [[root[0],root[1],bend[1],bend[0]],[bend[0],bend[1],tip[1],tip[0]]];
}

function quad(x0,x1,y,z0,z1) { return [[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]]; }

function rounded(ctx,x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function decoration(ctx,type,x,y,s) {
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);
  ctx.lineWidth /= s;
  ctx.beginPath();
  if (type === 'leaf') {
    ctx.moveTo(-.8,.65);
    ctx.quadraticCurveTo(-.9,-.95,.8,-.65);
    ctx.quadraticCurveTo(.9,.82,-.8,.65);
    ctx.moveTo(-.79,.64);
    ctx.lineTo(.49,-.43);
  } else if (type === 'sun') {
    ctx.arc(0,0,.48,0,Math.PI*2);
    for (let k=0;k<8;k++) {
      const a=k*Math.PI/4;
      ctx.moveTo(.65*Math.cos(a),.65*Math.sin(a));
      ctx.lineTo(.92*Math.cos(a),.92*Math.sin(a));
    }
  } else {
    ctx.moveTo(0,-1);
    ctx.quadraticCurveTo(.13,-.16,.9,0);
    ctx.quadraticCurveTo(.13,.16,0,1);
    ctx.quadraticCurveTo(-.13,.16,-.9,0);
    ctx.quadraticCurveTo(-.13,-.16,0,-1);
  }
  ctx.stroke();
  ctx.restore();
}

class View {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.w = this.h = 0;
    this.scale = 1;
    this.fx = [];
    this.bg = document.createElement('canvas');
    this.density = 1;
  }

  resize(job) {
    const w = this.canvas.clientWidth, h = this.canvas.clientHeight;
    const dpr = Math.min(devicePixelRatio || 1, 1.65);
    if (w !== this.w || h !== this.h || dpr !== this.density) {
      this.w=w; this.h=h; this.density=dpr;
      this.canvas.width=Math.max(1,Math.round(w*dpr));
      this.canvas.height=Math.max(1,Math.round(h*dpr));
      this.ctx.setTransform(dpr,0,0,dpr,0,0);
      this.makeDesk();
    }
    const flat = axes.flatMap((_, i) => hinge(job,i,0,0).flat()).map(project);
    const extents = flat.reduce((acc, [x,y]) => [Math.min(acc[0],x),Math.max(acc[1],x),Math.min(acc[2],y),Math.max(acc[3],y)], [0,0,0,0]);
    const [left,right,top,bottom] = extents;
    this.scale = Math.max(1, Math.min((w-36)/(right-left), (h-45)/(bottom-top), 85));
    this.cx = w/2-(left+right)*this.scale/2;
    this.cy = h*.5-(top+bottom)*this.scale/2+3;
  }

  screen(point) {
    const [x,y] = project(point);
    return [this.cx+x*this.scale, this.cy+y*this.scale];
  }

  marker(job,index) {
    const flap = hinge(job,index,0,0)[1];
    const center = flap[0].map((_,a)=>flap.reduce((sum,p)=>sum+p[a],0)/4);
    const [x,y] = this.screen(center);
    return [clamp(x,25,this.w-25),clamp(y,28,this.h-30)];
  }

  target(job) { return this.screen([0,job.h+.1,0]); }

  makeDesk() {
    const {w,h,bg} = this;
    bg.width=Math.max(1,w); bg.height=Math.max(1,h);
    const ctx=bg.getContext('2d');
    const grad=ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0,'#687b77'); grad.addColorStop(.47,'#455c61'); grad.addColorStop(1,'#303d48');
    ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
    for(let i=0;i<1150;i++){
      const x=(i*197.47)%w, y=(i*87.37)%h;
      ctx.fillStyle=i%2?'#ffffff13':'#1727341d';
      ctx.fillRect(x,y,1+(i%4)*.3,.7);
    }
    ctx.lineWidth=1; ctx.strokeStyle='#d0d9b621';
    rounded(ctx,5,5,w-10,h-10,10); ctx.stroke();
    ctx.strokeStyle='#e0e7c21d';
    for(let x=13;x<w-7;x+=9){
      ctx.beginPath();ctx.moveTo(x,h-4);ctx.lineTo(x,h-(x%45<10?12:8));ctx.stroke();
    }
    if(h>w*.98){
      ctx.save();
      ctx.translate(31,43);ctx.rotate(-.10);
      ctx.fillStyle='#21303973';rounded(ctx,3,5,91,73,4);ctx.fill();
      ctx.fillStyle='#e6c6a2';rounded(ctx,0,0,91,73,4);ctx.fill();
      ctx.fillStyle='#fbebcb';rounded(ctx,-3,-3,91,70,4);ctx.fill();
      ctx.fillStyle='#8e4a44';ctx.font='bold 9px system-ui';ctx.fillText('AIR POST',10,15);
      ctx.fillStyle='#5f6257';ctx.font='8px system-ui';ctx.fillText('HAND WRAPPED',10,26);
      ctx.fillStyle='#d9b594';ctx.fillRect(10,34,66,1);ctx.fillRect(10,44,56,1);ctx.fillRect(10,54,63,1);
      ctx.strokeStyle='#ac6c61';ctx.lineWidth=1;ctx.beginPath();ctx.arc(75,12,8,0,Math.PI*2);ctx.stroke();
      ctx.restore();
      ctx.save();ctx.translate(34,h-80);ctx.rotate(.27);
      ctx.fillStyle='#1e303760';rounded(ctx,0,4,77,11,4);ctx.fill();
      ctx.fillStyle='#d8a562';rounded(ctx,0,0,69,9,4);ctx.fill();

  };
  button.onpointermove=e=>{
    if(gesture?.id!==e.pointerId || gesture.flap!==flap) return;
    const dx=e.clientX-gesture.x, dy=e.clientY-gesture.y;
    gesture.moved ||= Math.hypot(dx,dy)>8;
    if(flap===null) {
      if(!gesture.moved) return;
      const held=byId('heldSeal');
      held.hidden=false;held.style.left=e.clientX+'px';held.style.top=e.clientY+'px';
      return;
    }
    const [x,y]=table.marker(C.jobs[parcel.job],flap), [tx,ty]=table.target(C.jobs[parcel.job]);
    const distance=Math.hypot(tx-x,ty-y);
    gesture.amount=(dx*(tx-x)+dy*(ty-y))/Math.max(1,distance);
    values[flap]=Math.max(0,Math.min(.89,gesture.amount/Math.max(26,distance*.77)));
    requestDraw();
  };
  button.onpointerup=e=>{
    if(gesture?.id!==e.pointerId || gesture.flap!==flap) return;
    const {moved,amount}=gesture;
    gesture=undefined;
    byId('heldSeal').hidden=true;
    if(flap!==null) {
      if(!moved || amount>=15) commitFold(flap);
      else animate(flap,0,160);
      return;
    }
    if(!moved) { commitSeal(0,0); return; }
    const rect=byId('desk').getBoundingClientRect(), [x,y]=table.target(C.jobs[parcel.job]);
    commitSeal((e.clientX-rect.left-x)/table.scale,(e.clientY-rect.top-y)/table.scale);
  };
  button.onpointercancel=cancelGesture;
  button.onlostpointercapture=e=>{if(gesture?.id===e.pointerId) cancelGesture();};
  button.onclick=e=>{
    if(e.detail!==0) return;
    if(flap===null) commitSeal(0,0); else commitFold(flap);
  };
}

const flapButtons=C.symbols.map((label,index)=>{
  const button=document.createElement('button');
  button.className='flap';
  button.textContent=C.glyphs[index];
  button.setAttribute('aria-label','Fold '+label);
  byId('flaps').append(button);
  bindGesture(button,index);
  return button;
});
bindGesture(byId('stamp'),null);
byId('orders').onclick=()=>openMenu('orders');
byId('paper').onclick=()=>openMenu('paper');
byId('close').onclick=()=>menuMode==='paper'?openMenu('orders'):byId('menu').close();
byId('restart').onclick=()=>{byId('menu').close();resetParcel(parcel.job,true);};
byId('receipt').onclick=showResult;
byId('back').onclick=()=>byId('result').close();
byId('next').onclick=()=>{
  byId('result').close();
  if(parcel.job<C.jobs.length-1) resetParcel(parcel.job+1);
  else openMenu('orders');
};
byId('sound').onclick=()=>{profile.mute=!profile.mute;persist();update();notes('select');};
new ResizeObserver(positionControls).observe(byId('desk'));
window.addEventListener('pagehide',()=>{cancelGesture();host.stop();});
window.addEventListener('pageshow',event=>{if(event.persisted)host=makeHost();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelGesture();});

host=makeHost();
update();

})();</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212934"><meta name="description" content="Fold, seal and dispatch eight beautifully wrapped parcels.">
<title>PARCEL PRESS — The Wrapping Desk</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game">
  <header class="bar">
    <div class="mark" aria-hidden="true">✦</div>
    <div class="brand"><b>PARCEL PRESS</b></div>
    <button id="orders" class="icon" aria-label="Open menu">☰</button>
  </header>
  <section class="intro" aria-label="Current order">
    <div class="orderHeading"><span id="orderId"></span><h1 id="title"></h1></div>
    <b class="counter" id="count" aria-label="Folds completed">0 / 4</b>
  </section>
  <section class="desk" id="desk" aria-label="Wrapping board">
    <canvas id="table" aria-hidden="true"></canvas>
    <div id="flaps" class="flaps"></div>
    <div id="dropTarget" class="dropTarget" hidden aria-hidden="true"><i></i></div>
    <div id="heldSeal" class="heldSeal" hidden aria-hidden="true">✦</div>
    <div class="toast" id="toast" role="status"></div>
  </section>
  <section class="dock" aria-label="Wrapping instructions">
    <p id="clue"></p>
    <div id="ruleIcons" class="rules" aria-label="Stacking order"></div>
    <button id="stamp" class="primary" hidden>Seal</button>
    <button id="receipt" class="primary" hidden>Receipt</button>
  </section>
</main>
<dialog id="menu" aria-labelledby="menuTitle">
  <div class="dialogHead"><h2 id="menuTitle"></h2><button id="close" class="icon" aria-label="Close menu">×</button></div>
  <div id="menuTools" class="menuTools">
    <button id="paper" class="quiet">Paper</button>
    <button id="sound" class="quiet" aria-pressed="false">Sound on</button>
    <button id="restart" class="quiet">Restart</button>
  </div>
  <div id="menuBody"></div>
</dialog>
<dialog id="result" aria-labelledby="resultTitle">
  <div class="receipt">
    <button id="back" class="icon" aria-label="Close receipt">×</button>
    <h2 id="resultTitle"></h2>
    <p class="stars" id="stars"></p>
    <p id="details"></p>
    <button id="next" class="primary">Next →</button>
  </div>
</dialog>
<script type="module" src="app.mjs"></script>
</body></html>
